{% extends "base.html" %}

{% block title %}Server Error - Family Tree{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 text-center">
            <div class="error-page">
                <h1 class="display-1 fw-bold text-danger">500</h1>
                <h2 class="mb-4">Server Error</h2>
                <p class="lead mb-4">Something went wrong on our end. Our team has been notified and we're working to fix it.</p>
                
                <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                    <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-primary btn-lg px-4 gap-3">
                        <i class="bi bi-house-door"></i> Go to Dashboard
                    </a>
                    <button onclick="location.reload()" class="btn btn-outline-secondary btn-lg px-4">
                        <i class="bi bi-arrow-clockwise"></i> Refresh Page
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
