{% extends "base.html" %}

{% block title %}Page Not Found - Family Tree{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 text-center">
            <div class="error-page">
                <h1 class="display-1 fw-bold text-danger">404</h1>
                <h2 class="mb-4">Page Not Found</h2>
                <p class="lead mb-4">Sorry, the page you're looking for doesn't exist or has been moved.</p>
                
                <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                    <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-primary btn-lg px-4 gap-3">
                        <i class="bi bi-house-door"></i> Go to Dashboard
                    </a>
                    <a href="{{ url_for('family.family_tree') }}" class="btn btn-outline-secondary btn-lg px-4">
                        <i class="bi bi-diagram-3"></i> View Family Tree
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
