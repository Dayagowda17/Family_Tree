{% extends "base.html" %}

{% block title %}Edit {{ member.get_full_name() }} - Family Tree{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8 offset-lg-2">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-pencil"></i> Edit {{ member.get_full_name() }}</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <!-- Basic Information -->
                    <h5 class="mb-3">Basic Information</h5>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="first_name" class="form-label">First Name *</label>
                            <input type="text" class="form-control" id="first_name" 
                                   name="first_name" value="{{ member.first_name }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="last_name" class="form-label">Last Name *</label>
                            <input type="text" class="form-control" id="last_name" 
                                   name="last_name" value="{{ member.last_name }}" required>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="gender" class="form-label">Gender *</label>
                            <select class="form-select" id="gender" name="gender" required>
                                <option value="Male" {% if member.gender == 'Male' %}selected{% endif %}>Male</option>
                                <option value="Female" {% if member.gender == 'Female' %}selected{% endif %}>Female</option>
                                <option value="Other" {% if member.gender == 'Other' %}selected{% endif %}>Other</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="dob" class="form-label">Date of Birth</label>
                            <input type="date" class="form-control" id="dob" name="dob" 
                                   value="{% if member.dob %}{{ member.dob.strftime('%Y-%m-%d') }}{% endif %}">
                        </div>
                    </div>
                    
                    <!-- Contact Information -->
                    <h5 class="mb-3 mt-4">Contact Information</h5>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" 
                                   name="email" value="{{ member.email or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="tel" class="form-control" id="phone" 
                                   name="phone" value="{{ member.phone or '' }}">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="address" class="form-label">Address</label>
                        <textarea class="form-control" id="address" name="address" 
                                  rows="2">{{ member.address or '' }}</textarea>
                    </div>
                    
                    <!-- Family Relationships -->
                    <h5 class="mb-3 mt-4">Family Relationships</h5>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="father_id" class="form-label">Father</label>
                            <select class="form-select" id="father_id" name="father_id">
                                <option value="">Select father</option>
                                {% for m in members %}
                                    {% if m.id != member.id %}
                                        <option value="{{ m.id }}" {% if member.father_id == m.id %}selected{% endif %}>
                                            {{ m.get_full_name() }}
                                        </option>
                                    {% endif %}
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="mother_id" class="form-label">Mother</label>
                            <select class="form-select" id="mother_id" name="mother_id">
                                <option value="">Select mother</option>
                                {% for m in members %}
                                    {% if m.id != member.id %}
                                        <option value="{{ m.id }}" {% if member.mother_id == m.id %}selected{% endif %}>
                                            {{ m.get_full_name() }}
                                        </option>
                                    {% endif %}
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="spouse_id" class="form-label">Spouse</label>
                        <select class="form-select" id="spouse_id" name="spouse_id">
                            <option value="">Select spouse</option>
                            {% for m in members %}
                                {% if m.id != member.id %}
                                    <option value="{{ m.id }}" {% if member.spouse_id == m.id %}selected{% endif %}>
                                        {{ m.get_full_name() }}
                                    </option>
                                {% endif %}
                            {% endfor %}
                        </select>
                    </div>
                    
                    <!-- Biography -->
                    <h5 class="mb-3 mt-4">Biography</h5>
                    
                    <div class="mb-3">
                        <label for="biography" class="form-label">Biography</label>
                        <textarea class="form-control" id="biography" name="biography" 
                                  rows="4">{{ member.biography or '' }}</textarea>
                    </div>
                    
                    <!-- Buttons -->
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-check-circle"></i> Update Member
                        </button>
                        <a href="{{ url_for('family.view_member', member_id=member.id) }}" 
                           class="btn btn-secondary btn-lg">
                            <i class="bi bi-x-circle"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
